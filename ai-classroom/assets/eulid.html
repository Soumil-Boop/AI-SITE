<div class="mascot-wrap">
      <svg class="mascot-svg" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" aria-label="Eulid, the Seek-O-Sphere alien mascot">
        <defs>
          <radialGradient id="euBody" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#9BBA82"/><stop offset="1" stop-color="#586B4E"/></radialGradient>
          <radialGradient id="euEye" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#FBF3E4"/><stop offset="1" stop-color="#ECDBC0"/></radialGradient>
          <linearGradient id="euDome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".04"/></linearGradient>
        </defs>
        <ellipse cx="120" cy="248" rx="70" ry="10" fill="#3E2B1E" opacity=".16"/>
        <g class="eu-tentacles">
          <!-- The five legs, in the order they read left to right. Each is a
               real button: role, label and tabindex, so a keyboard reaches
               them and a screen reader says what they are. The paths and
               their fills are exactly as they were — only the wrapper and
               the tip badge are new. -->
          <g class="eu-leg" data-leg="lens"      role="button" tabindex="0" aria-label="Magnifier — press to turn the pointer into a lens">
            <path fill="url(#euBody)" d="M84 152 q-42 18 -56 66 q-5 17 10 20 q15 3 18 -14 q7 -42 38 -56 z"/>
            <g class="eu-tip" transform="translate(38,227)">
              <circle class="eu-tip-disc" r="13"/>
              <g class="eu-glyph" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="-1.5" cy="-1.5" r="5"/><path d="M2.4 2.4 L6 6"/>
              </g>
            </g>
          </g>
          <g class="eu-leg" data-leg="mark"      role="button" tabindex="0" aria-label="Highlighter — press to highlight text you select">
            <path fill="url(#euBody)" d="M102 160 q-30 34 -40 64 q-6 17 9 21 q14 4 17 -12 q6 -36 30 -60 z"/>
            <g class="eu-tip" transform="translate(70,236)">
              <circle class="eu-tip-disc" r="13"/>
              <g class="eu-glyph" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-5 5 L-5 2 L1 -5 L5 -1 L-2 5 Z"/><path d="M-6 7 L6 7"/>
              </g>
            </g>
          </g>
          <g class="eu-leg" data-leg="read"      role="button" tabindex="0" aria-label="Read aloud — press, then select text and Eulid reads it">
            <path fill="url(#euBody)" d="M120 164 q-14 40 -12 78 q1 17 15 16 q13 -1 12 -18 q-3 -40 8 -72 z"/>
            <g class="eu-tip" transform="translate(121,245)">
              <circle class="eu-tip-disc" r="13"/>
              <g class="eu-glyph" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-5 -2 L-2 -2 L2 -5.5 L2 5.5 L-2 2 L-5 2 Z"/>
                <path d="M4.6 -3.2 a5 5 0 0 1 0 6.4"/>
              </g>
            </g>
          </g>
          <g class="eu-leg" data-leg="dashboard" role="button" tabindex="0" aria-label="My dashboard">
            <path fill="url(#euBody)" d="M138 160 q30 34 40 64 q6 17 -9 21 q-14 4 -17 -12 q-6 -36 -30 -60 z"/>
            <g class="eu-tip" transform="translate(170,236)">
              <circle class="eu-tip-disc" r="13"/>
              <g class="eu-glyph" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-5.5 -5 L-0.5 -5 L-0.5 0 L-5.5 0 Z"/><path d="M1.5 -5 L5.5 -5 L5.5 2 L1.5 2 Z"/>
                <path d="M-5.5 2.5 L-0.5 2.5 L-0.5 5.5 L-5.5 5.5 Z"/><path d="M1.5 4.5 L5.5 4.5"/>
              </g>
            </g>
          </g>
          <g class="eu-leg" data-leg="custom"    role="button" tabindex="0" aria-label="Your own shortcut — press to choose what it does">
            <path fill="url(#euBody)" d="M156 152 q42 18 56 66 q5 17 -10 20 q-15 3 -18 -14 q-7 -42 -38 -56 z"/>
            <g class="eu-tip" transform="translate(202,227)">
              <circle class="eu-tip-disc" r="13"/>
              <g class="eu-glyph" stroke-linecap="round" stroke-linejoin="round">
                <path d="M0 -6 L1.8 -1.8 L6 0 L1.8 1.8 L0 6 L-1.8 1.8 L-6 0 L-1.8 -1.8 Z"/>
              </g>
            </g>
          </g>
          <g fill="#3E5C4A" opacity=".45">
            <circle cx="52" cy="212" r="3.6"/><circle cx="63" cy="224" r="3"/>
            <circle cx="188" cy="212" r="3.6"/><circle cx="177" cy="224" r="3"/>
            <circle cx="118" cy="224" r="3.6"/><circle cx="127" cy="234" r="3"/>
          </g>
        </g>
        <circle cx="120" cy="104" r="88" fill="url(#euDome)" stroke="rgba(255,255,255,.42)" stroke-width="2"/>
        <path d="M58 76 q-18 -18 -8 -36 q20 6 24 32 z" fill="url(#euBody)"/>
        <path d="M182 76 q18 -18 8 -36 q-20 6 -24 32 z" fill="url(#euBody)"/>
        <circle cx="120" cy="104" r="66" fill="url(#euBody)"/>
        <ellipse cx="68" cy="122" rx="10" ry="6.5" fill="#C0562F" opacity=".22"/>
        <ellipse cx="172" cy="122" rx="10" ry="6.5" fill="#C0562F" opacity=".22"/>
        <ellipse cx="120" cy="98" rx="34" ry="39" fill="url(#euEye)"/>
        <g class="eulid-pupil"><ellipse cx="120" cy="102" rx="15" ry="23" fill="#26324C"/><circle cx="127" cy="90" r="5.5" fill="#fff"/><circle cx="114" cy="112" r="2.6" fill="#fff" opacity=".6"/></g>
        <ellipse class="eu-lid" cx="120" cy="98" rx="35" ry="40" fill="url(#euBody)"/>
        <path d="M104 148 q16 15 32 0" stroke="#3E2B1E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M120 40 q0 -18 10 -24" stroke="#586B4E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle class="eu-bulb" cx="131" cy="14" r="6.5" fill="#C0562F"/>
      </svg>
      <div class="mascot-name">Eulid</div>
    </div>
